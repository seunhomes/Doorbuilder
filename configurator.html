<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build your door · Toronto Custom Doors</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: var(--bone); }

  /* ── Two-pane layout ─────────────────────────── */
  .cfg {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    min-height: calc(100vh - 70px);
  }
  @media (max-width: 1100px) { .cfg { grid-template-columns: 1fr; } }

  /* ── Preview pane ────────────────────────────── */
  .preview {
    position: sticky;
    top: 70px;
    height: calc(100vh - 70px);
    background: radial-gradient(circle at 50% 40%, #EFE6D4 0%, #D9CDB6 55%, #A89678 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @media (max-width: 1100px) {
    .preview { position: relative; top: 0; height: 70vh; }
  }
  .preview__door { width: 100%; height: 100%; }
  .preview__door svg { width: 100%; height: 100%; display: block; }

  .preview__overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 28px 32px;
  }
  .preview__overlay > * { pointer-events: auto; }

  .preview__top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .preview__chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(31, 24, 19, 0.78);
    color: var(--linen);
    backdrop-filter: blur(12px);
    border-radius: 100px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .preview__chip .dot {
    width: 6px; height: 6px;
    background: var(--brass);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--brass);
  }
  .preview__actions {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(31, 24, 19, 0.18);
    background: rgba(244, 237, 225, 0.85);
    backdrop-filter: blur(10px);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:hover:not(:disabled) {
    background: var(--paper);
    transform: translateY(-1px);
  }
  .icon-btn svg { width: 14px; height: 14px; }

  /* Floating price card in bottom-left of preview */
  .preview__bottom {
    margin-top: auto;
  }
  .preview__price-card {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px;
    border-radius: 4px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: fit-content;
  }
  .preview__price-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(244,237,225,0.55);
    line-height: 1.2;
  }
  .preview__price {
    font-family: var(--serif);
    font-size: clamp(28px, 3vw, 38px);
    line-height: 1;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }
  .preview__cta {
    flex-shrink: 0;
    background: var(--brass);
    color: var(--ink);
    padding: 12px 16px;
    border-radius: 2px;
    font-size: 13px;
    letter-spacing: 0.02em;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    border: 0;
    transition: background 0.15s;
  }
  .preview__cta:hover { background: oklch(0.8 0.13 80); }

  /* ── Options pane (stepper) ──────────────────── */
  .options {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 70px);
  }
  @media (max-width: 1100px) { .options { max-height: none; } }

  /* ── Step tabs ───────────────────────────────── */
  .step-tabs {
    display: flex;
    background: var(--cream);
    border-bottom: 1px solid var(--linen);
    flex-shrink: 0;
  }
  .step-tab {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 16px 24px;
    background: var(--cream);
    color: var(--mocha);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    position: relative;
    transition: background 0.15s, color 0.15s;
    border-right: 1px solid var(--linen);
  }
  .step-tab:last-child { border-right: 0; }
  .step-tab:hover { background: var(--linen); color: var(--ink); }
  .step-tab.done { background: var(--linen); color: var(--ink); }
  .step-tab.done .step-tab__num { background: var(--mocha); color: var(--paper); }
  .step-tab.active {
    background: var(--ink);
    color: var(--paper);
    z-index: 2;
  }
  .step-tab.active .step-tab__num { background: var(--brass); color: var(--ink); }
  .step-tab.active .step-tab__chev path { fill: var(--ink); }
  .step-tab__num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--linen);
    color: var(--mocha);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .step-tab__lbl {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
  }
  .step-tab__chev {
    position: absolute;
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 30px;
    z-index: 1;
  }
  .step-tab__chev path { fill: var(--cream); transition: fill 0.15s; }
  .step-tab:hover .step-tab__chev path,
  .step-tab.done .step-tab__chev path { fill: var(--linen); }
  .step-tab.active .step-tab__chev path { fill: var(--ink); }

  @media (max-width: 720px) {
    .step-tab { padding: 12px 8px 12px 14px; gap: 6px; }
    .step-tab__lbl { font-size: 13px; }
    .step-tab__num { width: 22px; height: 22px; font-size: 10px; }
    .step-tab__chev { display: none; }
  }

  /* ── Substep bar (prev/next) ─────────────────── */
  .substep-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 32px;
    background: var(--bone);
    border-bottom: 1px solid var(--linen);
    flex-shrink: 0;
  }
  .substep-bar__lbl {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .substep-bar__step {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mocha);
  }
  .substep-bar__title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .nav-arrow {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--stone);
    background: var(--paper);
    color: var(--espresso);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .nav-arrow:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .nav-arrow svg { width: 14px; height: 14px; }
  .nav-arrow--primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .nav-arrow--primary:hover:not(:disabled) {
    background: var(--espresso);
    border-color: var(--espresso);
  }

  /* ── Step body ───────────────────────────────── */
  .step-body {
    flex: 1;
    overflow-y: auto;
    padding: 32px 32px 16px;
  }
  @media (max-width: 720px) { .step-body { padding: 24px 20px 16px; } }

  .sub { margin-bottom: 36px; }
  .sub__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--linen);
  }
  .sub__title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0;
  }
  .sub__count {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mocha);
  }
  .hint {
    font-size: 13px;
    color: var(--mocha);
    margin: 0 0 16px;
    line-height: 1.5;
  }

  /* ── Tiles ───────────────────────────────────── */
  .tile-grid {
    display: grid;
    gap: 10px;
  }
  .tile-grid--4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 720px) {
    .tile-grid--4 { grid-template-columns: repeat(2, 1fr); }
  }
  .tile-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }

  .tile {
    position: relative;
    background: var(--bone);
    border: 1px solid var(--linen);
    border-radius: 3px;
    cursor: pointer;
    padding: 0;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    color: inherit;
    overflow: hidden;
  }
  .tile:hover {
    border-color: var(--mocha);
    transform: translateY(-1px);
  }
  .tile.active {
    border-color: var(--ink);
    background: var(--paper);
    box-shadow: 0 0 0 2px var(--ink) inset;
  }
  .tile__preview {
    aspect-ratio: 3 / 4;
    background: var(--cream);
    overflow: hidden;
    position: relative;
  }
  .tile__preview--wide {
    aspect-ratio: 1 / 1;
  }
  .tile__preview--icon {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bone);
  }
  .tile__preview svg { width: 100%; height: 100%; }
  .tile__body {
    padding: 10px 12px 14px;
  }
  .tile__label {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.15;
    color: var(--ink);
    font-weight: 500;
  }
  .tile__sub {
    font-size: 11px;
    color: var(--mocha);
    margin-top: 2px;
    line-height: 1.3;
  }
  .tile__price {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--mocha);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* ── Pills ───────────────────────────────────── */
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    padding: 10px 16px;
    border: 1px solid var(--stone);
    background: var(--bone);
    cursor: pointer;
    border-radius: 100px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--espresso);
    transition: all 0.15s;
  }
  .pill:hover { border-color: var(--mocha); }
  .pill.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .pill__price {
    margin-left: 6px;
    opacity: 0.55;
    font-size: 11px;
  }

  /* ── Swatches ────────────────────────────────── */
  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (max-width: 720px) {
    .swatch-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .swatch-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bone);
    border: 1px solid var(--linen);
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    text-align: left;
    transition: all 0.15s;
  }
  .swatch-card:hover { border-color: var(--mocha); }
  .swatch-card.active {
    border-color: var(--ink);
    background: var(--paper);
    box-shadow: 0 0 0 1px var(--ink) inset;
  }
  .swatch-card__dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .swatch-card__label {
    font-size: 13px;
  }
  .swatch-note {
    margin-top: 10px;
    font-size: 12px;
    color: var(--mocha);
  }

  /* ── Footer nav ──────────────────────────────── */
  .step-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 32px 24px;
    background: var(--paper);
    border-top: 1px solid var(--linen);
    flex-shrink: 0;
  }
  @media (max-width: 720px) { .step-footer { padding: 16px 20px; } }

  /* ── Saved-comparison pill ───────────────────── */
  .saved-pill {
    margin: 0 32px 20px;
    padding: 10px 16px;
    background: var(--cream);
    border: 1px solid var(--linen);
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mocha);
  }
  .saved-pill svg { width: 12px; height: 12px; }
  .saved-pill button {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--rust);
    cursor: pointer;
    font: inherit;
  }

  /* ── Compare modal ───────────────────────────── */
  .compare-modal {
    position: fixed;
    inset: 0;
    background: rgba(31, 24, 19, 0.72);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .compare-modal__inner {
    background: var(--paper);
    border-radius: 4px;
    width: 100%;
    max-width: 1100px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .compare-modal__head {
    padding: 24px 32px;
    border-bottom: 1px solid var(--linen);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .compare-modal__head h2 {
    font-family: var(--serif);
    font-size: 28px;
    margin: 0;
    font-weight: 500;
  }
  .compare-modal__body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--linen);
    flex: 1;
    overflow-y: auto;
  }
  .compare-col {
    background: var(--paper);
  }
  .compare-col__preview {
    aspect-ratio: 3 / 4;
    background: radial-gradient(circle at 50% 40%, #EFE6D4 0%, #D9CDB6 55%, #A89678 100%);
    overflow: hidden;
  }
  .compare-col__head {
    padding: 16px 24px;
    border-bottom: 1px solid var(--linen);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .compare-col__name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }
  .compare-col__tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mocha);
    margin-left: 10px;
    font-weight: 400;
  }
  .compare-col__price {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--mocha);
  }
  .compare-col__list { padding: 16px 24px; }
  .compare-col__list .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dotted var(--linen);
    gap: 12px;
  }
  .compare-col__list .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mocha);
  }
  .compare-col__list .v { text-align: right; }
  .compare-col__list .row.diff .v {
    background: oklch(0.95 0.06 80);
    padding: 1px 6px;
    border-radius: 2px;
  }

  /* ── Toast ──────────────────────────────────── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 22px;
    border-radius: 4px;
    font-size: 13px;
    z-index: 250;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: toast-in 0.2s ease;
  }
  @keyframes toast-in {
    from { transform: translate(-50%, 16px); opacity: 0; }
    to   { transform: translate(-50%, 0);    opacity: 1; }
  }
</style>
</head>
<body>

<div data-partial="nav" data-active="configurator"></div>

<div id="app"></div>

<div data-partial="footer"></div>

<script src="partials.js"></script>
<script src="door-render.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="configurator-app.jsx"></script>

</body>
</html>
